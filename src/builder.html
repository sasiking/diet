<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Visual Builder Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #fbfbf9;
      --ruled-line: #e3ebf5;
      --margin-line: #f7a8b8;
      --ink-blue: #0f3870;
      --ink-dark: #1e293b;
      --ink-red: #b91c1c;
      --ink-green: #15803d;
      --ink-purple: #6b21a8;
      --ink-orange: #c2410c;
      --ink-yellow: #a16207;
      --ink-teal: #0f766e;
      --ink-cyan: #0369a1;
      --ink-indigo: #4338ca;
      --ink-rose: #be123c;
      --ink-amber: #b45309;
      --ink-emerald: #047857;
      --ink-violet: #7c2d12;
      --highlight-yellow: rgba(254, 240, 138, 0.85);
      --highlight-green: rgba(187, 247, 208, 0.75);
      --highlight-pink: rgba(251, 207, 232, 0.75);
      --highlight-blue: rgba(186, 230, 253, 0.75);
      --highlight-orange: rgba(254, 215, 170, 0.85);
      --sticky-yellow: #fef9c3;
      --sticky-pink: #ffe4e6;
      --sticky-blue: #e0f2fe;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0f172a;
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ================= SIDEBAR TOOLBOX ================= */
    .toolbox {
      width: 340px;
      min-width: 340px;
      background: #1e293b;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #334155;
      z-index: 100;
    }

    .toolbox-header {
      padding: 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .toolbox-header h2 {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #93c5fd;
    }

    /* Active File & Document Title Display */
    .doc-meta-box {
      margin-top: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .doc-meta-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #94a3b8;
      display: block;
      margin-bottom: 2px;
    }
    .doc-meta-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #38bdf8;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }
    .doc-meta-input:focus {
      color: #ffffff;
    }

    .toolbox-items {
      padding: 14px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-group-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.8px;
      margin-top: 10px;
      margin-bottom: 2px;
    }

    .tool-btn {
      background: #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: #2563eb;
      border-color: #60a5fa;
      transform: translateX(3px);
    }

    /* Sidebar Highlighter Bar */
    .sidebar-highlighter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 4px;
    }
    .hl-palette-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      transition: transform 0.15s ease;
    }
    .hl-palette-btn:hover {
      transform: scale(1.15);
    }
    .hl-clear-btn {
      background: #334155;
      color: #f87171;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #475569;
    }

    .actions-panel {
      padding: 14px;
      border-top: 1px solid #334155;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-import { background: #6366f1; color: white; }
    .btn-import:hover { background: #818cf8; }
    .btn-export { background: #059669; color: white; }
    .btn-export:hover { background: #10b981; }
    .btn-print { background: #2563eb; color: white; }
    .btn-print:hover { background: #3b82f6; }
    .btn-clear { background: #dc2626; color: white; }
    .btn-clear:hover { background: #ef4444; }

    /* ================= FLOATING HIGHLIGHTER TOOLBAR ================= */
    #floatingHighlightToolbar {
      position: absolute;
      display: none;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 5px 8px;
      gap: 6px;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 1000;
      user-select: none;
    }
    #floatingHighlightToolbar::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
    }
    .floating-hl-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #94a3b8;
      margin-right: 2px;
    }

    /* ================= DYNAMIC CANVAS ARCHITECTURE ================= */
    .canvas-wrapper {
      flex-grow: 1;
      background: #64748b;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      position: relative;
    }

    .notebook-container {
      width: 100%;
      max-width: 980px;
      min-height: 1200px;
      height: auto;
      background-color: var(--bg-page);
      background-image: 
        linear-gradient(90deg, transparent 48px, var(--margin-line) 48px, var(--margin-line) 50px, transparent 50px),
        linear-gradient(var(--ruled-line) 1px, transparent 1px);
      background-size: 100% 28px, 100% 28px;
      background-repeat: repeat-y, repeat;
      padding: 35px 35px 80px 65px;
      border-radius: 4px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      line-height: 28px;
      font-family: 'Kalam', cursive, sans-serif;
      color: var(--ink-dark);
      position: relative;
      margin-bottom: 50px;
    }

    /* Element Wrapper & Action Controls */
    .block-wrapper {
      position: relative;
      margin-bottom: 16px;
      break-inside: avoid;
    }

    .block-controls {
      position: absolute;
      top: -12px;
      right: 4px;
      display: none;
      gap: 4px;
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 10;
    }

    .block-wrapper:hover .block-controls {
      display: flex;
    }

    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
      font-family: sans-serif;
    }

    .control-btn:hover {
      color: #f87171;
    }

    /* CARD LOCAL TOOLBAR */
    .card-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      user-select: none;
    }

    .color-swatches {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.2);
    }

    .swatch:hover {
      transform: scale(1.25);
    }

    .card-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .card-tool-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      padding: 2px 6px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .card-tool-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Typography */
    h1, h2, h3, h4 { font-family: 'Caveat', cursive; font-weight: 700; }
    
    .title-section { text-align: center; border-bottom: 3px double var(--ink-blue); padding-bottom: 12px; margin-bottom: 20px; }
    .title-section h1 { font-size: 40px; color: var(--ink-blue); letter-spacing: 0.5px; line-height: 1.15; }
    .title-section .subtitle { font-size: 20px; color: var(--ink-red); font-family: 'Patrick Hand', cursive; }
    .badge-tag { display: inline-block; background: var(--ink-purple); color: #fff; padding: 2px 14px; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; margin-top: 4px; }

    .section-header { font-size: 26px; color: var(--ink-red); margin: 24px 0 10px 0; display: flex; align-items: center; border-bottom: 2px dashed rgba(185, 28, 28, 0.4); padding-bottom: 2px; }
    .section-header span { background: var(--highlight-yellow); padding: 0 8px; border-radius: 4px; }

    /* Grids */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 12px; }
    .grid-col { display: flex; flex-direction: column; }

    /* Thematic Cards */
    .card-note { background: rgba(255,255,255,0.88); border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card-note.blue   { border-left: 5px solid var(--ink-blue); }
    .card-note.green  { border-left: 5px solid var(--ink-green); }
    .card-note.purple { border-left: 5px solid var(--ink-purple); }
    .card-note.red    { border-left: 5px solid var(--ink-red); }
    .card-note.orange { border-left: 5px solid var(--ink-orange); }
    .card-note.yellow { border-left: 5px solid var(--ink-yellow); }
    .card-note.teal   { border-left: 5px solid var(--ink-teal); }
    .card-note.cyan   { border-left: 5px solid var(--ink-cyan); }
    .card-note.indigo { border-left: 5px solid var(--ink-indigo); }
    .card-note.rose   { border-left: 5px solid var(--ink-rose); }
    .card-note.amber  { border-left: 5px solid var(--ink-amber); }

    .bullet-list { list-style: none; padding-left: 2px; }
    .bullet-list li { margin-bottom: 5px; position: relative; padding-left: 22px; font-size: 16px; line-height: 24px; min-height: 24px; }
    .bullet-list li::before { content: "➔"; position: absolute; left: 0; color: var(--ink-blue); font-weight: bold; }

    .sub-point { margin-left: 18px; padding-left: 10px; border-left: 2px dashed #94a3b8; font-size: 15px; line-height: 22px; margin-top: 4px; margin-bottom: 8px; min-height: 22px; }
    
    /* Regular text block wrapper with hover delete */
    .regular-text-block {
      position: relative;
      margin: 8px 0;
      padding: 4px 28px 4px 4px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .regular-text-block:hover {
      background: rgba(241, 245, 249, 0.6);
    }
    .regular-text-content {
      font-size: 16px;
      line-height: 24px;
      color: var(--ink-dark);
      outline: none;
      min-height: 24px;
    }
    .text-del-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(15, 23, 42, 0.7);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
      z-index: 10;
    }
    .regular-text-block:hover .text-del-btn {
      display: flex;
    }
    .text-del-btn:hover {
      background: #dc2626;
    }

    /* Sticky Notes & Built-in Delete Controls */
    .sticky { 
      position: relative;
      padding: 14px 16px; 
      border-radius: 2px; 
      box-shadow: 2px 4px 10px rgba(0,0,0,0.1); 
      transform: rotate(-0.5deg); 
      margin: 12px 0; 
      font-size: 15.5px; 
      line-height: 22px; 
      font-family: 'Patrick Hand', cursive; 
    }
    .sticky.yellow { background: var(--sticky-yellow); border-top: 8px solid #fef08a; }
    .sticky.pink { background: var(--sticky-pink); border-top: 8px solid #fbcfe8; transform: rotate(0.6deg); }
    .sticky.blue { background: var(--sticky-blue); border-top: 8px solid #bae6fd; }

    .sticky-del-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      background: rgba(15, 23, 42, 0.7);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
      z-index: 10;
    }
    .sticky:hover .sticky-del-btn {
      display: flex;
    }
    .sticky-del-btn:hover {
      background: #dc2626;
    }

    /* Highlight Spans */
    .hl-yellow { background: var(--highlight-yellow); padding: 1px 4px; border-radius: 3px; }
    .hl-green  { background: var(--highlight-green); padding: 1px 4px; border-radius: 3px; }
    .hl-pink   { background: var(--highlight-pink); padding: 1px 4px; border-radius: 3px; }
    .hl-blue   { background: var(--highlight-blue); padding: 1px 4px; border-radius: 3px; }
    .hl-orange { background: var(--highlight-orange); padding: 1px 4px; border-radius: 3px; }

    /* Dropdowns */
    .reveal-box { margin-top: 8px; border-radius: 5px; overflow: hidden; }
    .reveal-box summary { cursor: pointer; user-select: none; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; color: #1e40af; background: #eff6ff; border: 1px dashed #93c5fd; padding: 6px 12px; border-radius: 5px; outline: none; transition: background 0.2s ease; list-style: none; display: flex; align-items: center; gap: 6px; }
    .reveal-box summary::-webkit-details-marker { display: none; }
    .reveal-box summary::before { content: "▶"; font-size: 11px; color: #2563eb; transition: transform 0.2s ease; }
    .reveal-box[open] summary::before { transform: rotate(90deg); }
    .reveal-box[open] summary { background: #dbeafe; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .reveal-content { background: #f8fafc; border: 1px dashed #93c5fd; border-top: none; padding: 8px 12px; border-bottom-left-radius: 5px; border-bottom-right-radius: 5px; }

    /* MCQ Cards */
    .mcq-card { background: #ffffff; border: 1px solid #cbd5e1; border-left: 5px solid #2563eb; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 2px 2px 5px rgba(0,0,0,0.04); }
    .mcq-badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; background-color: #dbeafe; color: #1e40af; padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; font-family: 'Inter', sans-serif; }
    .mcq-options { margin: 6px 0 8px 14px; font-size: 14.5px; line-height: 22px; }

    /* Tables */
    .hand-table { width: 100%; border-collapse: collapse; margin: 10px 0 16px 0; background: rgba(255,255,255,0.85); font-size: 15px; }
    .hand-table th, .hand-table td { border: 1px solid #94a3b8; padding: 7px 10px; text-align: left; line-height: 20px; }
    .hand-table th { background: #e2e8f0; color: var(--ink-blue); font-family: 'Caveat', cursive; font-size: 19px; }

    /* Exam Traps */
    .exam-trick { background: #fff1f2; border: 2px dashed var(--ink-red); border-radius: 8px; padding: 14px 18px; margin: 16px 0; position: relative; }
    .exam-trick::before { content: "⚡ TOPPER'S RED ALERT: CONSTITUTIONAL TRAPS ⚡"; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; color: var(--ink-red); position: absolute; top: -11px; left: 18px; background: #fff; padding: 0 8px; border: 1px solid var(--ink-red); border-radius: 4px; }

    /* Mains Section Styling */
    .mains-section { background: #fffafa; border: 2px solid #7f1d1d; border-radius: 8px; padding: 20px 20px 14px 20px; margin: 24px 0 10px 0; position: relative; box-shadow: 0 5px 15px rgba(127, 29, 29, 0.08); }
    .mains-section::before { content: "✍ APPSC MAINS PRACTICE & PREVIOUS YEAR QUESTIONS (PYQs)"; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 900; letter-spacing: 0.5px; color: #ffffff; position: absolute; top: -12px; left: 20px; background: #991b1b; padding: 2px 12px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .hl-dark-red { background-color: #991b1b; color: #ffffff; padding: 1px 7px; border-radius: 4px; font-weight: bold; font-size: 14px; display: inline-block; font-family: 'Inter', sans-serif; }
    
    .mains-q-item { 
      position: relative; 
      margin-bottom: 14px; 
      border-bottom: 1px dashed rgba(153, 27, 27, 0.25); 
      padding-bottom: 12px; 
    }
    .mains-q-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .mains-q-title { font-size: 17px; color: #7f1d1d; font-weight: 700; line-height: 24px; padding-right: 40px; }
    .mains-framework { font-size: 15px; color: #334155; margin-top: 4px; padding-left: 10px; border-left: 2.5px solid #991b1b; line-height: 22px; }

    .mains-box-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(153, 27, 27, 0.15);
      user-select: none;
    }

    .mains-item-controls {
      position: absolute;
      top: 0;
      right: 0;
      display: none;
      gap: 3px;
    }
    .mains-q-item:hover .mains-item-controls {
      display: flex;
    }

    /* Print settings */
    @media print {
      body { background: none; }
      .toolbox, .card-toolbar, .mains-box-toolbar, .mains-item-controls, .sticky-del-btn, .text-del-btn, #floatingHighlightToolbar { display: none !important; }
      .canvas-wrapper { padding: 0; background: none; height: auto; overflow: visible; }
      .block-controls { display: none !important; }
      .reveal-box { display: block !important; }
      .reveal-box summary { display: none !important; }
      .reveal-content { display: block !important; border-top: 1px dashed #93c5fd !important; }
      .notebook-container { box-shadow: none; width: 100%; max-width: 100%; padding: 10px 15px 15px 45px; margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <!-- LEFT TOOLBOX -->
  <aside class="toolbox">
    <div class="toolbox-header">
      <h2>Notes Element Studio</h2>
      <div class="doc-meta-box">
        <label class="doc-meta-label" for="docTitleInput">Active Note Title</label>
        <input type="text" id="docTitleInput" class="doc-meta-input" value="Untitled Polity Note" placeholder="Enter title or let canvas auto-detect..." oninput="syncManualTitle(this.value)">
      </div>
    </div>
    
    <div class="toolbox-items">
      <!-- HIGHLIGHTER PALETTE IN SIDEBAR -->
      <div class="tool-group-title">Text Highlighter</div>
      <div class="sidebar-highlighter-row">
        <button class="hl-palette-btn" style="background:#fef08a;" title="Highlight Yellow" onmousedown="handleHighlightClick(event, 'hl-yellow')"></button>
        <button class="hl-palette-btn" style="background:#bbf7d0;" title="Highlight Green" onmousedown="handleHighlightClick(event, 'hl-green')"></button>
        <button class="hl-palette-btn" style="background:#fbcfe8;" title="Highlight Pink" onmousedown="handleHighlightClick(event, 'hl-pink')"></button>
        <button class="hl-palette-btn" style="background:#bae6fd;" title="Highlight Blue" onmousedown="handleHighlightClick(event, 'hl-blue')"></button>
        <button class="hl-palette-btn" style="background:#fed7aa;" title="Highlight Orange" onmousedown="handleHighlightClick(event, 'hl-orange')"></button>
        <button class="hl-palette-btn hl-clear-btn" title="Remove Highlight" onmousedown="handleClearHighlightClick(event)">✕</button>
      </div>

      <div class="tool-group-title">Layout & Structure</div>
      <button class="tool-btn" onclick="insertBlock('banner')">🏷️ Blank Title Banner</button>
      <button class="tool-btn" onclick="insertBlock('header')">📌 Section Header</button>
      <button class="tool-btn" onclick="insertBlock('grid-2')">🔲 Blank 2-Column Side-by-Side</button>
      <button class="tool-btn" onclick="insertBlock('table-blank')">📊 Blank Comparison Table</button>

      <div class="tool-group-title">Thematic Single Cards</div>
      <button class="tool-btn" onclick="insertBlock('card-blue')">📘 Blank Card (Blue)</button>
      <button class="tool-btn" onclick="insertBlock('card-yellow')">📒 Blank Card (Yellow)</button>
      <button class="tool-btn" onclick="insertBlock('card-teal')">🩵 Blank Card (Teal)</button>
      <button class="tool-btn" onclick="insertBlock('card-green')">📗 Blank Card (Green)</button>
      <button class="tool-btn" onclick="insertBlock('card-purple')">🔮 Blank Card (Purple)</button>

  <script>
    let importedFileName = null;
    let manualTitleOverride = null;

    function syncManualTitle(val) {
      manualTitleOverride = val.trim() || null;
    }

    /* Intelligent Title Extraction from Document Canvas */
    function resolveDocumentTitle() {
      if (manualTitleOverride) return manualTitleOverride;

      const canvas = document.getElementById('editorCanvas');
      // 1. Search for main Title banner h1
      const mainH1 = canvas.querySelector('.title-section h1');
      if (mainH1 && mainH1.innerText.trim() && mainH1.innerText.trim() !== 'Main Title Here') {
        return mainH1.innerText.trim();
      }

      // 2. Search for first Section Header
      const firstSectionHeader = canvas.querySelector('.section-header span');
      if (firstSectionHeader && firstSectionHeader.innerText.trim() && firstSectionHeader.innerText.trim() !== 'Section Header') {
        return firstSectionHeader.innerText.trim();
      }

      // 3. Search for any card h3
      const firstCardH3 = canvas.querySelector('.card-note h3');
      if (firstCardH3 && firstCardH3.innerText.trim() && firstCardH3.innerText.trim() !== 'Card Title') {
        return firstCardH3.innerText.trim();
      }

      // 4. Fallback to imported filename (without .html extension) or generic title
      if (importedFileName) {
        return importedFileName.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
      }

      return 'Polity Study Notes';
    }

    function updateTitleUI() {
      const titleInput = document.getElementById('docTitleInput');
      if (!manualTitleOverride) {
        titleInput.value = resolveDocumentTitle();
      }
    }

    // Auto-update document title preview on input inside the canvas
    document.getElementById('editorCanvas').addEventListener('input', function() {
      if (!manualTitleOverride) {
        updateTitleUI();
      }
    });

    /* ========================================================
       TEXT HIGHLIGHTING & REMOVAL ENGINE
       ======================================================== */
    function handleHighlightClick(e, colorClass) {
      e.preventDefault();
      applyHighlight(colorClass);
      hideFloatingToolbar();
    }

    function handleClearHighlightClick(e) {
      e.preventDefault();
      removeHighlight();
      hideFloatingToolbar();
    }

    function applyHighlight(colorClass) {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const span = document.createElement('span');
      span.className = colorClass;

      try {
        range.surroundContents(span);
      } catch (err) {
        const extracted = range.extractContents();
        extracted.querySelectorAll('[class*="hl-"]').forEach(el => {
          while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
          el.remove();
        });
        span.appendChild(extracted);
        range.insertNode(span);
      }

      selection.removeAllRanges();
      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      selection.addRange(newRange);
    }

    function removeHighlight() {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      const currentEl = selection.anchorNode.nodeType === 3 ? selection.anchorNode.parentElement : selection.anchorNode;

      const parentHl = currentEl.closest('[class*="hl-"]');
      if (parentHl) {
        const parent = parentHl.parentNode;
        while (parentHl.firstChild) {
          parent.insertBefore(parentHl.firstChild, parentHl);
        }
        parentHl.remove();
        parent.normalize();
        return;
      }

      const cloned = range.cloneContents();
      if (cloned.querySelector('[class*="hl-"]')) {
        const extracted = range.extractContents();
        extracted.querySelectorAll('[class*="hl-"]').forEach(el => {
          while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
          el.remove();
        });
        range.insertNode(extracted);
      }
    }

    /* Floating Toolbar Positioning */
    const floatingToolbar = document.getElementById('floatingHighlightToolbar');
    const canvasWrapper = document.getElementById('canvasWrapper');

    function updateFloatingToolbar() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) {
        hideFloatingToolbar();
        return;
      }

      const anchorEl = selection.anchorNode.nodeType === 3 ? selection.anchorNode.parentElement : selection.anchorNode;
      if (!anchorEl || !anchorEl.closest('#editorCanvas')) {
        hideFloatingToolbar();
        return;
      }

      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      const wrapperRect = canvasWrapper.getBoundingClientRect();

      if (rect.width === 0 && rect.height === 0) {
        hideFloatingToolbar();
        return;
      }

      const topPos = rect.top - wrapperRect.top + canvasWrapper.scrollTop - 48;
      const leftPos = rect.left - wrapperRect.left + canvasWrapper.scrollLeft + (rect.width / 2);

      floatingToolbar.style.top = `${topPos}px`;
      floatingToolbar.style.left = `${leftPos}px`;
      floatingToolbar.style.transform = 'translateX(-50%)';
      floatingToolbar.style.display = 'flex';
    }

    function hideFloatingToolbar() {
      if (floatingToolbar) {
        floatingToolbar.style.display = 'none';
      }
    }

    document.addEventListener('mouseup', function(e) {
      if (floatingToolbar.contains(e.target)) return;
      setTimeout(updateFloatingToolbar, 10);
    });

    document.addEventListener('keyup', function(e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        setTimeout(updateFloatingToolbar, 10);
      }
    });

    canvasWrapper.addEventListener('scroll', hideFloatingToolbar);

    const templates = {

      'exam-trap': `<div class="exam-trick"><ul class="bullet-list" contenteditable="true" style="margin-top:2px;"><li><strong>TRAP: "Common incorrect statement."</strong> ➔ <strong>WRONG!</strong><div class="sub-point">▫ <strong>Constitutional Mandate:</strong> Reason why...</div></li></ul></div>`,

          <span class="mcq-badge" contenteditable="true">EXAM BADGE</span>
          <div contenteditable="true" style="font-weight: 600; font-size: 15px; margin-bottom: 4px;">Q. Question prompt?</div>
          <div class="mcq-options" contenteditable="true">1) Option 1<br>2) Option 2<br>3) Option 3<br>4) Option 4</div>
          <details class="reveal-box">
            <summary>Show Answer & Constitutional Catch</summary>
            <div class="reveal-content"><div contenteditable="true" style="background-color: #ffffff; padding: 8px 10px; margin-top: 2px;">➔ <strong>Correct Answer:</strong> <span class="hl-pink">Option 1</span><br>▫ <strong>Explanation:</strong> Explanation here...</div></div>
          </details>

      'table-blank': `

          <thead><tr><th style="width: 25%;">Parameter</th><th style="width: 37.5%;">Category A</th><th style="width: 37.5%;">Category B</th></tr></thead>

        </table>`
    };

    function wrapInBlock(htmlContent) {
      const wrapper = document.createElement('div');
      wrapper.className = 'block-wrapper';
      wrapper.innerHTML = `
        <div class="block-controls">
          <button class="control-btn" onclick="moveUp(this)">▲</button>
          <button class="control-btn" onclick="moveDown(this)">▼</button>
          <button class="control-btn" onclick="deleteBlock(this)">✕</button>
        </div>
        ${htmlContent}
      `;
      return wrapper;
    }

    function insertBlock(type) {
      const canvas = document.getElementById('editorCanvas');
      const block = wrapInBlock(templates[type]);
      canvas.appendChild(block);
      block.scrollIntoView({ behavior: 'smooth', block: 'end' });
      updateTitleUI();
    }

    function insertMainsQuestion() {
      const canvas = document.getElementById('editorCanvas');
      let mainsSection = canvas.querySelector('.mains-section');
      if (!mainsSection) {
        const initialHTML = `
          <div class="mains-section">
            ${getSingleMainsQuestionItemHTML(1)}
            ${getMainsBoxToolbarHTML()}
          </div>
        `;
        const block = wrapInBlock(initialHTML);
        canvas.appendChild(block);
        block.scrollIntoView({ behavior: 'smooth', block: 'end' });
      } else {
        const currentCount = mainsSection.querySelectorAll('.mains-q-item').length;
        const qNum = currentCount + 1;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = getSingleMainsQuestionItemHTML(qNum).trim();
        const newItem = tempDiv.firstChild;
        const toolbar = mainsSection.querySelector('.mains-box-toolbar');
        if (toolbar) {
          mainsSection.insertBefore(newItem, toolbar);
        } else {
          mainsSection.appendChild(newItem);
        }
        newItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        focusElement(newItem.querySelector('.mains-q-title'));
      }
    }

    function insertMainsQuestionDirect(btn) {
      const mainsSection = btn.closest('.mains-section');
      if (!mainsSection) return;
      const currentCount = mainsSection.querySelectorAll('.mains-q-item').length;
      const qNum = currentCount + 1;
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = getSingleMainsQuestionItemHTML(qNum).trim();
      const newItem = tempDiv.firstChild;
      const toolbar = mainsSection.querySelector('.mains-box-toolbar');
      mainsSection.insertBefore(newItem, toolbar);
      newItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
      focusElement(newItem.querySelector('.mains-q-title'));
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      importedFileName = file.name;
      manualTitleOverride = null;
      const reader = new FileReader();
      reader.onload = function(e) {
        importHTMLContent(e.target.result);
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function importHTMLContent(rawHTML) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHTML, 'text/html');
      const sourceContainer = doc.querySelector('.notebook-container') || doc.body;
      if (!sourceContainer) {
        alert('Could not locate content in file.');
        return;
      }

      // Check if original HTML document has a custom <title> tag
      if (doc.title && doc.title !== 'Polity Notes Output' && doc.title !== 'Notes Visual Builder Studio') {
        manualTitleOverride = doc.title;
      }

      const canvas = document.getElementById('editorCanvas');
      canvas.innerHTML = '';
      const children = Array.from(sourceContainer.children);
      children.forEach(child => {
        if (child.tagName === 'SCRIPT' || child.tagName === 'STYLE') return;
        child.querySelectorAll('.block-controls, .card-toolbar, .mains-box-toolbar, .mains-item-controls, .sticky-del-btn, .text-del-btn, #floatingHighlightToolbar').forEach(el => el.remove());
        
        if (child.classList.contains('card-note')) {
          child.insertAdjacentHTML('afterbegin', getCardToolbarHTML());
        } else {
          child.querySelectorAll('.card-note').forEach(c => {
            if (!c.querySelector('.card-toolbar')) {
              c.insertAdjacentHTML('afterbegin', getCardToolbarHTML());
            }
          });
        }

        const stickies = child.classList.contains('sticky') ? [child] : Array.from(child.querySelectorAll('.sticky'));
        stickies.forEach(st => {
          if (!st.querySelector('.sticky-del-btn')) {
            st.insertAdjacentHTML('afterbegin', getStickyDeleteButtonHTML());
          }
        });

        const textBlocks = child.classList.contains('regular-text-block') ? [child] : Array.from(child.querySelectorAll('.regular-text-block'));
        textBlocks.forEach(tb => {
          if (!tb.querySelector('.text-del-btn')) {
            tb.insertAdjacentHTML('afterbegin', `<button class="text-del-btn" contenteditable="false" onclick="this.closest('.regular-text-block').remove()">✕</button>`);
          }
        });

        if (child.classList.contains('mains-section') || child.querySelector('.mains-section')) {
          const section = child.classList.contains('mains-section') ? child : child.querySelector('.mains-section');
          if (!section.querySelector('.mains-box-toolbar')) {
            section.insertAdjacentHTML('beforeend', getMainsBoxToolbarHTML());
          }
          section.querySelectorAll('.mains-q-item').forEach(item => {
            item.insertAdjacentHTML('afterbegin', `
              <div class="mains-item-controls" contenteditable="false">
                <button class="control-btn" style="background:#991b1b;" onclick="this.closest('.mains-q-item').remove()">✕</button>
              </div>
            `);
          });
        }
        makeEditable(child);
        if (child.classList.contains('block-wrapper')) {
          canvas.appendChild(child);
        } else {
          const wrapped = wrapInBlock(child.outerHTML);
          canvas.appendChild(wrapped);
        }
      });
      updateTitleUI();
      alert('Document loaded successfully!');
    }

    function makeEditable(node) {
      const editableSelectors = [
        'h1', 'h2', 'h3', 'h4', 'span', 'p', 'li', 'ul', 'div.sub-point',
        'div.sticky', 'div.title-section', 'div.section-header', 'div.mains-q-title',
        'div.mains-framework', 'div.mcq-options', 'table.hand-table', 'div.exam-trick',
        'div.regular-text-content'
      ];
      editableSelectors.forEach(sel => {
        node.querySelectorAll(sel).forEach(el => {
          if (!el.closest('.card-toolbar') && !el.closest('.block-controls') && !el.closest('.mains-box-toolbar') && !el.closest('.mains-item-controls') && !el.classList.contains('sticky-del-btn') && !el.classList.contains('text-del-btn') && !el.closest('#floatingHighlightToolbar')) {
            el.setAttribute('contenteditable', 'true');
          }
        });
      });
      if (editableSelectors.some(sel => node.matches && node.matches(sel)) && !node.classList.contains('sticky-del-btn') && !node.classList.contains('text-del-btn') && !node.closest('#floatingHighlightToolbar')) {
        node.setAttribute('contenteditable', 'true');
      }
    }

    const colorMap = {
      blue:   { border: 'blue',   ink: 'var(--ink-blue)' },
      yellow: { border: 'yellow', ink: 'var(--ink-yellow)' },
      teal:   { border: 'teal',   ink: 'var(--ink-teal)' },
      green:  { border: 'green',  ink: 'var(--ink-green)' },
      purple: { border: 'purple', ink: 'var(--ink-purple)' },
      red:    { border: 'red',    ink: 'var(--ink-red)' },
      rose:   { border: 'rose',   ink: 'var(--ink-rose)' },
      amber:  { border: 'amber',  ink: 'var(--ink-amber)' }
    };

    function changeCardColor(swatchEl, colorName) {
      const card = swatchEl.closest('.card-note');
      if (!card) return;
      Object.keys(colorMap).forEach(c => card.classList.remove(c));
      card.classList.add(colorName);
      const heading = card.querySelector('h3');
      if (heading) heading.style.color = colorMap[colorName].ink;
    }

    function addBulletToCard(btn) {
      const card = btn.closest('.card-note');
      if (!card) return;
      let list = card.querySelector('.bullet-list');
      if (!list) {
        list = document.createElement('ul');
        list.className = 'bullet-list';
        list.contentEditable = 'true';
        card.appendChild(list);
      }
      const li = document.createElement('li');
      li.innerHTML = '<strong>Point:</strong> Description...';
      list.appendChild(li);
      focusElement(li);
    }

    function addSubpointToCard(btn) {
      const card = btn.closest('.card-note');
      if (!card) return;
      const list = card.querySelector('.bullet-list');
      if (!list) return;
      const sub = document.createElement('div');
      sub.className = 'sub-point';
      sub.innerHTML = '▫ <strong>Note:</strong> Details...';
      list.appendChild(sub);
      focusElement(sub);
    }

    function addTextToCard(btn) {
      const card = btn.closest('.card-note');
      if (!card) return;
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = getTextBlockHTML('Write regular text here...').trim();
      const textBlock = tempDiv.firstChild;
      card.appendChild(textBlock);
      focusElement(textBlock.querySelector('.regular-text-content'));
    }

    function addStickyToCard(btn, color) {
      const card = btn.closest('.card-note');
      if (!card) return;
      const sticky = document.createElement('div');
      sticky.className = `sticky ${color}`;
      sticky.innerHTML = `
        ${getStickyDeleteButtonHTML()}
        <div contenteditable="true">📌 <strong>Note:</strong> Write note here...</div>
      `;
      card.appendChild(sticky);
      focusElement(sticky.querySelector('[contenteditable="true"]'));
    }

    function focusElement(el) {
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    /* KEYBOARD AUTOMATION ENGINE */
    document.addEventListener('keydown', function(e) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const currentEl = selection.anchorNode.nodeType === 3 ? selection.anchorNode.parentElement : selection.anchorNode;

      if (e.key === 'Backspace') {
        const sticky = currentEl.closest('.sticky');
        if (sticky) {
          const cleanText = sticky.innerText.replace('✕', '').replace('📌', '').trim();
          if (cleanText === '' || cleanText === 'Note:') {
            e.preventDefault();
            sticky.remove();
            return;
          }
        }

        const textBlock = currentEl.closest('.regular-text-block');
        if (textBlock) {
          const content = textBlock.querySelector('.regular-text-content');
          if (content && content.innerText.trim() === '') {
            e.preventDefault();
            textBlock.remove();
            return;
          }
        }
      }

      if (e.key === 'Enter' && e.shiftKey) {
        const subOrBullet = currentEl.closest('.sub-point, li');
        if (subOrBullet) {
          e.preventDefault();
          const card = subOrBullet.closest('.card-note');
          const list = subOrBullet.closest('.bullet-list');
          
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = getTextBlockHTML('Write regular text here...').trim();
          const textBlock = tempDiv.firstChild;

          if (list && list.parentNode) {
            list.parentNode.insertBefore(textBlock, list.nextSibling);
          } else if (card) {
            card.appendChild(textBlock);
          }
          focusElement(textBlock.querySelector('.regular-text-content'));
          return;
        }
      }

      if (e.key === 'Enter' && !e.shiftKey) {
        const inTextBlock = currentEl.closest('.regular-text-content');
        if (inTextBlock) {
          e.preventDefault();
          const range = selection.getRangeAt(0);
          range.deleteContents();
          const br = document.createElement('br');
          range.insertNode(br);
          range.setStartAfter(br);
          range.setEndAfter(br);
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }

        const targetContainer = currentEl.closest('li, .sub-point, .sticky div[contenteditable="true"], .mains-framework');
        if (targetContainer) {
          e.preventDefault();
          const range = selection.getRangeAt(0);
          range.deleteContents();

          const br = document.createElement('br');
          const bulletText = document.createTextNode(' • ');

          range.insertNode(bulletText);
          range.insertNode(br);

          range.setStartAfter(bulletText);
          range.setEndAfter(bulletText);
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }
      }
    });

    function deleteBlock(btn) { 
      btn.closest('.block-wrapper').remove(); 
      updateTitleUI();
    }
    function moveUp(btn) {
      const wrapper = btn.closest('.block-wrapper');
      if (wrapper.previousElementSibling) wrapper.parentNode.insertBefore(wrapper, wrapper.previousElementSibling);
    }
    function moveDown(btn) {
      const wrapper = btn.closest('.block-wrapper');
      if (wrapper.nextElementSibling) wrapper.parentNode.insertBefore(wrapper, wrapper.nextElementSibling);
    }
    function clearCanvas() {
      if (confirm('Clear the entire notebook canvas?')) {
        document.getElementById('editorCanvas').innerHTML = '';
        manualTitleOverride = null;
        importedFileName = null;
        updateTitleUI();
      }
    }

    /* ========================================================
       DYNAMIC EXPORT WITH COMPUTED TITLE & FILENAME
       ======================================================== */
    function exportCleanHTML() {
      const canvasClone = document.getElementById('editorCanvas').cloneNode(true);
      canvasClone.querySelectorAll('.block-controls, .card-toolbar, .mains-box-toolbar, .mains-item-controls, .sticky-del-btn, .text-del-btn, #floatingHighlightToolbar').forEach(el => el.remove());
      canvasClone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));

      // 1. Resolve Document Title dynamically
      const resolvedTitle = resolveDocumentTitle();

      // 2. Resolve Dynamic Download File Name
      let downloadFilename;
      if (importedFileName) {
        downloadFilename = importedFileName;
      } else {
        // Convert resolved title to clean snake_case filename
        const sanitized = resolvedTitle.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
        downloadFilename = (sanitized || 'polity_notes') + '.html';
      }

      const fullHTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${resolvedTitle}</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  ${document.querySelector('style').innerHTML}
  body { background-color: #cbd5e1; display:flex; justify-content:center; padding:25px 10px; height:auto; overflow:visible; }
  .canvas-wrapper { height: auto; overflow: visible; padding: 0; background: none; }
  .notebook-container { box-shadow: 0 12px 30px rgba(0,0,0,0.15); margin-bottom: 0; }
</style>
</head>
<body>
  ${canvasClone.outerHTML}
</body>
</html>`;

      const blob = new Blob([fullHTML], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = downloadFilename;
      a.click();
    }
  </script>
</body>
</html>
